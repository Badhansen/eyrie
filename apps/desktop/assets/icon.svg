<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Eyrie's app icon, from 128 pt up. The favicon's mark (apps/web/public/favicon.svg)
    on the macOS icon grid: an 824 pt body at 100 pt, corner radius 185. A request is
    traced from a UI component through a service to a data store, as Eyrie's trace
    lens draws it, over the faint rest of the graph. icon-small.svg is the 16 and 32 pt
    version. scripts/make-icons.mjs renders both to the packaged files.
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#242b31"/>
      <stop offset="1" stop-color="#0d1012"/>
    </linearGradient>
    <radialGradient id="light" cx="300" cy="160" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="frontend" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#a1c0ff"/>
      <stop offset="0.6" stop-color="#7aa7ff"/>
      <stop offset="1" stop-color="#6a96ee"/>
    </radialGradient>
    <radialGradient id="service" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fbbb84"/>
      <stop offset="0.6" stop-color="#f5a25d"/>
      <stop offset="1" stop-color="#e48f4b"/>
    </radialGradient>
    <radialGradient id="data" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#76dbe5"/>
      <stop offset="0.6" stop-color="#47c9d6"/>
      <stop offset="1" stop-color="#37b5c2"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <g id="shadow">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="#0d1012" filter="url(#drop)"/>
  </g>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#body)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#light)"/>

    <!-- The rest of the graph, dimmed while one request is traced through it. -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.075" stroke-width="18" stroke-linecap="round">
      <path d="M460 357H694"/>
      <path d="M280 357V616"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.11" stroke-width="7">
      <circle cx="744" cy="357" r="50"/>
      <circle cx="280" cy="666" r="50"/>
    </g>

    <!-- The traced request: UI → service → data. -->
    <path d="M280 357H460V666H744" fill="none" stroke="#58d68d" stroke-opacity="0.32" stroke-width="58" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M280 357H460V666H744" fill="none" stroke="#58d68d" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="url(#body)" stroke-width="14">
      <circle cx="280" cy="357" r="80" fill="url(#frontend)"/>
      <circle cx="460" cy="512" r="80" fill="url(#service)"/>
      <circle cx="744" cy="666" r="80" fill="url(#data)"/>
    </g>

    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>
</svg>
